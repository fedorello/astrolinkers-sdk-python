name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job runs in a hermetic shell — fail on undefined variables and
# the first non-zero exit code so a half-broken matrix entry never
# lands as a green tick.
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # v8 runs on Node 24; v6 was Node 20 which GitHub Actions
        # deprecates in June 2026.
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --no-dev || uv sync --no-dev
        # ``--frozen`` is preferred for reproducibility but tolerates
        # the absence of ``uv.lock`` on first push.

      - name: Install dev dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Mypy --strict
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q
